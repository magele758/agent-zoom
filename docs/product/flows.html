  target.replaceChildren();
  const head = el('div');
  head.append(el('h2',title),el('div','负责 · '+owner,'who'));
  target.append(head);
  for (const [label,body] of [['带着什么来',input],['这一站留下什么',output]]) {
    const dl = el('dl');
    dl.append(el('dt',label),el('dd',body)); target.append(dl);
  }
  if (!connections.length) return;
  const jumps = el('div',undefined,'jumps');
  jumps.append(el('span','跟着流程走'));
  for (const [,dest,label] of connections) {
    const title = (label ? label+' → ' : '→ ') + byId.get(dest)[1];
    jumps.append(goLink(key,dest,title));
  }
  target.append(jumps);
}
let lastKey = null;
function render(moveFocus = false) {
  const [requested,requestedNode] = location.hash.slice(1).split('/');
  const key = Object.hasOwn(maps,requested) ? requested : 'business';
  const map = maps[key];
  const height = mapHeight(map);
  mapEl.style.aspectRatio = narrow.matches ? "auto" : width + "/" + height;
  document.querySelector("#live-hub").hidden = key !== "hub";
  const byId = new Map(map.nodes.map(n => [n[0],n]));
  const selected = byId.get(requestedNode) || map.nodes[0];
  const heading = document.querySelector('#flow-heading');
  heading.textContent=map.title;
  document.title = 'OPC OS · '+map.title;
  document.querySelector('#summary').textContent=map.summary;
  const more=document.querySelector('#read-more');
  more.href=map.doc;
  more.textContent='阅读'+({lines:'业务线',commercial:'7 层商业闭环',reuse:'原仓协作',business:'业务流程',navigation:'页面跳转',delegation:'全站委派',execution:'执行规则',hub:'个人工作账联动'})[key]+'分册 ↗';
  for (const tab of document.querySelectorAll('[data-map]')) {
    if (tab.dataset.map === key) tab.setAttribute('aria-current','page');
    else tab.removeAttribute('aria-current');
  }
  const connections=map.edges.filter(edge=>edge[0]===selected[0]);
  describe(detail,key,selected,connections,byId);
  mapEl.replaceChildren(renderWires(key,map,byId));
  let selectedLink;
  for (const [row,rowTitle] of map.rows.entries()) {
    const groupLabel=el('div',rowTitle,'row-label');
    groupLabel.style.top=(topY(row)-26)/height*100+'%';
    mapEl.append(groupLabel);
    for (const node of map.nodes.filter(n=>n[4]===row)) {
      const [id,title,subtitle,col,,kind]=node;
      const nodeLink=goLink(key,id,'');
      nodeLink.className='node '+kind;
      if (!narrow.matches) nodeLink.style.height = cardHeight / height * 100 + '%';
      nodeLink.style.setProperty('--x',(left(col)/width)*100+'%');
      nodeLink.style.setProperty('--y',(topY(row)/height)*100+'%');
      const words=el('span',undefined,'node-words');
      words.append(el('b',title),el('small',subtitle));
      const emblem=el('i',undefined,'symbol');emblem.setAttribute('aria-hidden','true');
      nodeLink.append(emblem,words);
      if(id===selected[0]) {nodeLink.setAttribute('aria-current','step');selectedLink=nodeLink;}
      mapEl.append(nodeLink);
      if (!narrow.matches) continue;
      const outgoing=map.edges.filter(edge=>edge[0]===id);
      if(id===selected[0]) {
        const inner=el('section',undefined,'detail mobile-detail');
        inner.setAttribute('aria-label','所选节点详情');
        describe(inner,key,node,outgoing,byId);
        mapEl.append(inner);
      } else if(outgoing.length) {
        const line=el('div',undefined,'mobile-next');
        for(const [,to,verb] of outgoing) {
          line.append(goLink(key,to,(verb || '接着')+' → '+byId.get(to)[1]));
        }
        mapEl.append(line);
      }
    }
  }
  if (key==='execution' && !narrow.matches) {
    const note=el('div',undefined,'map-note');
    note.append(el('b','反馈回到谁？'),el('span','计划退回原发起者。实现返工交给原执行者。'));
    mapEl.append(note);
  }
  if(!moveFocus && lastKey===null && requestedNode && narrow.matches && selectedLink) {
    selectedLink.scrollIntoView({block:'start'});
  } else if(moveFocus && lastKey===key && requestedNode && selectedLink) {
    selectedLink.focus({preventScroll:true});
    if(narrow.matches) selectedLink.scrollIntoView({block:'start'});
  } else if(moveFocus && lastKey!==key) {
    const tab=document.querySelector('[data-map="'+key+'"]');
    tab.focus({preventScroll:true});
    if(tab.getBoundingClientRect().bottom<0) tab.scrollIntoView({block:'start'});
  }
  lastKey=key;
}
window.addEventListener('hashchange',()=>render(true));
narrow.addEventListener('change',()=>render());
document.querySelector('#skip').addEventListener('click',event=>{
  event.preventDefault();
  document.querySelector('#flow-heading').focus();
});
render();
</script>
</body>
</html>
